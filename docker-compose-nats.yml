version: '3.8'

services:
  nats:
    image: nats:2.10-alpine
    container_name: benchmark-nats-jetstream
    ports:
      - "4223:4222"    # NATS client port (避免与现有NATS冲突)
      - "8223:8222"    # HTTP monitoring port (避免冲突)
      - "6223:6222"    # Cluster port (避免冲突)
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - benchmark_nats_data:/data
    environment:
      - NATS_DEBUG=true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - benchmark-network

  # RedPanda服务 (Kafka兼容的高性能替代)
  redpanda:
    image: redpandadata/redpanda:v23.2.15
    hostname: benchmark-redpanda
    container_name: benchmark-redpanda
    ports:
      - "29094:9092"   # RedPanda Kafka API port
      - "9645:9644"    # Admin API port
    command:
      - redpanda
      - start
      - --node-id=0
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=localhost:29094
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=localhost:33145
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --default-log-level=warn
    volumes:
      - benchmark_redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - benchmark-network

  # NATS监控面板 (可选)
  nats-box:
    image: natsio/nats-box:latest
    container_name: benchmark-nats-box
    depends_on:
      - nats
    command: >
      sh -c "
        echo '🎯 NATS & Kafka Benchmark Environment Ready!';
        echo '🔵 NATS Server: nats://nats:4222 (External: localhost:4223)';
        echo '🔵 NATS Monitoring: http://localhost:8223';
        echo '🟠 Kafka Server: localhost:29093';
        echo '📊 Use: docker exec -it benchmark-nats-box nats --help';
        echo '📊 Use: docker exec -it benchmark-kafka kafka-topics.sh --help';
        tail -f /dev/null
      "
    restart: unless-stopped
    networks:
      - benchmark-network

  # MySQL 8 — outbox system tests (Tier 1: DLQ lifecycle + idempotency against a real DB).
  # System tests t.Skip if this is unreachable; not required by the default `go test ./...` gate.
  mysql:
    image: mysql:8.0
    container_name: benchmark-mysql
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: outbox_system_test
    ports:
      - "13306:3306"
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ptest || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - benchmark-network

volumes:
  benchmark_nats_data:
    driver: local
  benchmark_redpanda_data:
    driver: local

networks:
  benchmark-network:
    driver: bridge
    name: benchmark-network
